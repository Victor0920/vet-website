# Name of your application. Used to uniquely configure containers.
service: website

# Name of the container image. Replace "my-user" with your registry username.
image: my-user/website

# Deploy to these servers. Replace with your server's public IP.
servers:
  web:
    - 192.168.0.1

# Enable SSL auto certification via Let's Encrypt. The domain's DNS A record
# must point at the server IP before the first deploy.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
proxy:
  ssl: true
  host: veterinario.example.com

# Credentials for your image host.
registry:
  # Docker Hub by default. For GitHub use: server: ghcr.io
  # server: ghcr.io
  username: my-user

  # Always use an access token rather than real password (pulled from .kamal/secrets).
  password:
    - KAMAL_REGISTRY_PASSWORD

# Configure builder setup. Building on an Apple Silicon Mac for an amd64 server
# is fine; Docker cross-compiles. Use arm64 if your server is ARM.
builder:
  arch: amd64

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # International format, digits only (no "+" or spaces)
    WHATSAPP_NUMBER: "34600000000"

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

# Persist the SQLite database and storage across deploys.
volumes:
  - "website_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests.
asset_path: /rails/public/assets
